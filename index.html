<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ONPE - Resultados Electorales</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f9;
            margin: 0;
        }

        header {
            background-color: #b30000;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 22px;
        }

        .container {
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: #ffffff;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .content {
            flex: 1;
            padding: 20px;
        }

        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
        }

        .card {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }

        .resultado {
            font-size: 18px;
            margin-top: 10px;
        }

        .ganador {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    Oficina Nacional de Procesos Electorales - Resultados
</header>

<div class="container">

    <!-- FILTROS -->
    <div class="sidebar">
        <h3>Filtros</h3>

        <label>Región:</label>
        <select id="region" onchange="actualizar()">
            <option value="Lima">Lima</option>
            <option value="Cusco">Cusco</option>
            <option value="Arequipa">Arequipa</option>
        </select>

        <label>Candidato:</label>
        <select id="candidato" onchange="actualizar()">
            <option value="P1">Candidato 1</option>
            <option value="P2">Candidato 2</option>
        </select>
    </div>

    <!-- RESULTADOS -->
    <div class="content">

        <div class="card">
            <h3>Resultados de Votación</h3>
            <p id="votosP1">Votos P1: 0</p>
            <p id="votosP2">Votos P2: 0</p>
            <p class="resultado" id="ganador"></p>
        </div>

        <div class="card">
            <h3>Interpretación</h3>
            <p id="interpretacion">
                Seleccione una región para visualizar el comportamiento electoral.
            </p>
        </div>

    </div>

</div>

<script>
    function actualizar() {
        let region = document.getElementById("region").value;

        // Datos simulados
        let data = {
            "Lima": {p1: 5000, p2: 4500},
            "Cusco": {p1: 3000, p2: 4000},
            "Arequipa": {p1: 3500, p2: 3500}
        };

        let votosP1 = data[region].p1;
        let votosP2 = data[region].p2;

        document.getElementById("votosP1").innerText = "Votos P1: " + votosP1;
        document.getElementById("votosP2").innerText = "Votos P2: " + votosP2;

        let ganador = "";

        if (votosP1 > votosP2) {
            ganador = "Gana Candidato 1";
        } else if (votosP2 > votosP1) {
            ganador = "Gana Candidato 2";
        } else {
            ganador = "Empate";
        }

        document.getElementById("ganador").innerText = ganador;

        // Interpretación
        document.getElementById("interpretacion").innerText =
            "En la región de " + region + ", el resultado muestra que " + ganador +
            ", lo cual refleja el comportamiento electoral predominante.";
    }
</script>

</body>
</html>
